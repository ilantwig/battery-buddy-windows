name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified LLVM-MinGW
        shell: pwsh
        run: ./scripts/setup-toolchain.ps1
      - name: Build and test
        shell: pwsh
        run: |
          ./build.ps1
          ./test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryBuddy-Windows-x64
          path: dist/BatteryBuddy.exe

