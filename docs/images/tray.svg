<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Battery percentage in the Windows notification area</title><desc id="desc">Illustration of the Battery Buddy tray icon displaying 84 percent.</desc>
<rect width="900" height="430" rx="24" fill="#101821"/><circle cx="808" cy="67" r="104" fill="#1c3440" opacity=".45"/>
<text x="56" y="75" fill="#8cdcb9" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">BATTERY BUDDY</text>
<text x="56" y="132" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600">Your battery, at a glance</text>
<text x="56" y="177" fill="#b9c8cc" font-family="Segoe UI,Arial,sans-serif" font-size="20">See the charge level right in the Windows tray.</text>
<rect x="56" y="239" width="788" height="118" rx="16" fill="#202b34" stroke="#40505a"/><text x="85" y="308" fill="#c5d1d4" font-family="Segoe UI,Arial,sans-serif" font-size="19">Notification area</text>
<rect x="650" y="260" width="76" height="76" rx="6" fill="#243f48"/><text x="688" y="313" fill="white" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">84</text>
<path d="M759 292 l10 -8 10 8" fill="none" stroke="#d9e3e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="808" y="305" fill="#d9e3e5" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="19">•••</text>
<text x="56" y="403" fill="#91a4a9" font-family="Segoe UI,Arial,sans-serif" font-size="15">Illustration · the tray icon updates as the battery changes</text>
</svg>

