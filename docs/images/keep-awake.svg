<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Keep the computer awake</title><desc id="desc">Illustration of the Battery Buddy tray menu with Keep computer awake checked and a green indicator beneath the battery percentage.</desc>
<rect width="900" height="430" rx="24" fill="#101821"/><circle cx="810" cy="68" r="104" fill="#1c3440" opacity=".45"/>
<text x="56" y="75" fill="#8cdcb9" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">BATTERY BUDDY</text>
<text x="56" y="132" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600">Keep work running</text>
<text x="56" y="177" fill="#b9c8cc" font-family="Segoe UI,Arial,sans-serif" font-size="20">Request that Windows prevent automatic system sleep.</text>
<rect x="56" y="209" width="560" height="171" rx="14" fill="#202b34" stroke="#40505a"/><text x="82" y="250" fill="#8cdcb9" font-family="Segoe UI Symbol,Segoe UI,Arial,sans-serif" font-size="24">✓</text><text x="119" y="250" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="22">Keep computer awake</text><text x="119" y="284" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="22">Start at sign-in</text><line x1="80" y1="302" x2="592" y2="302" stroke="#4c5a60"/><text x="119" y="336" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="22">About</text><text x="119" y="368" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="22">Exit</text>
<rect x="696" y="253" width="76" height="76" rx="6" fill="#243f48"/><text x="734" y="302" fill="white" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="700">84</text><rect x="707" y="317" width="54" height="6" fill="#5be692"/>
<text x="56" y="409" fill="#91a4a9" font-family="Segoe UI,Arial,sans-serif" font-size="15">Illustration · the display can still turn off; deliberate sleep is not blocked</text>
</svg>

